[package]
name = "orbis"
version = "0.1.0"
authors = ["Jiri Vysoky <jiri.vysoky@gmail.com>"]
edition = "2021"
description = "DAZ Studio scenes to Octane X (.orbx)"
license = "GPL-3.0-or-later"
repository = "https://github.com/vysokyj/orbis"

[lib]
name = "orbis"
path = "src/lib.rs"

[[bin]]
name = "orbis"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
# Gzip — DAZ files (.duf, .dsf, .dbz) are gzip-compressed JSON
flate2 = "1"
# Compositing DAZ layered images, texture downscaling
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
zip = "9"

# Mesh processing, texture compositing and PNG/zip coding are ~10× slower
# unoptimized: a debug-build export took 25 s instead of 3 s.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
