<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- ORBIS: the world as a lit orb — Comenius's Orbis pictus, rendered. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#11141a"/>
    </radialGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="0.22" stop-color="#f4a340"/>
      <stop offset="0.62" stop-color="#b8461c"/>
      <stop offset="1" stop-color="#3a1208"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#f4a340" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f4a340" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="128" cy="128" r="84"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#tile)"/>
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="84" fill="url(#orb)"/>
  <g clip-path="url(#ball)" fill="none" stroke="#fff3dc" stroke-opacity="0.55" stroke-width="5">
    <ellipse cx="128" cy="128" rx="30" ry="84"/>
    <ellipse cx="128" cy="128" rx="62" ry="84"/>
    <line x1="128" y1="40" x2="128" y2="216"/>
    <path d="M44 120 A84 22 0 0 0 212 120"/>
    <path d="M62 76 A66 16 0 0 0 194 76"/>
    <path d="M55 170 A73 18 0 0 0 201 170"/>
  </g>
  <ellipse cx="100" cy="88" rx="26" ry="16" fill="#fff" fill-opacity="0.45" transform="rotate(-30 100 88)"/>
</svg>
