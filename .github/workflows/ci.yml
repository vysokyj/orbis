name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Import the Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/orbis-sign.keychain-db"
          pw=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"

      - name: Package the plugin
        run: scripts/package.sh

      - name: Notarize
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit dist/*.zip --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          unzip -q dist/*.zip -d "$RUNNER_TEMP/check"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP"/check/*/orbis

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/orbis-sign.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: orbis-macos
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
